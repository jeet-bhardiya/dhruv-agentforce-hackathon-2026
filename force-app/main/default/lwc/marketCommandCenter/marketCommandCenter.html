<template>
    <div class="mcc-wrapper">

        <!-- Event Alert Banner -->
        <template if:true={hasEvent}>
            <div class={eventBannerClass}>
                <lightning-icon icon-name="utility:warning" size="x-small" variant="inverse"
                    class="slds-m-right_x-small"></lightning-icon>
                <strong>LIVE ALERT &nbsp;·&nbsp;</strong>
                <span class="slds-m-left_xx-small">{data.eventHeadline}</span>
                <span class="slds-m-left_medium banner-time">{data.eventTime}</span>
                <span class="severity-badge">{data.eventSeverity} Severity</span>
            </div>
        </template>

        <!-- Funnel Cards -->
        <div class="funnel-row">
            <div class="funnel-card">
                <div class="funnel-number">{totalClients}</div>
                <div class="funnel-label">Total Clients</div>
                <div class="funnel-sub">Bank Portfolio</div>
            </div>
            <div class="funnel-arrow">&#8594;</div>
            <div class="funnel-card funnel-card--alert">
                <div class="funnel-number">{impactedClients}</div>
                <div class="funnel-label">Impacted</div>
                <div class="funnel-sub">&gt;20% rate-sensitive exposure</div>
            </div>
            <div class="funnel-arrow">&#8594;</div>
            <div class="funnel-card funnel-card--mine">
                <div class="funnel-number">{myClients}</div>
                <div class="funnel-label">Your Clients</div>
                <div class="funnel-sub">Needs immediate attention</div>
            </div>
        </div>

        <!-- Client Table -->
        <lightning-card title="Your Impacted Clients — Ranked by Exposure"
            icon-name="standard:account" class="table-card">
            <template if:true={hasClients}>
                <div class="slds-p-horizontal_small slds-p-bottom_small">
                    <lightning-datatable
                        key-field="accountId"
                        data={tableData}
                        columns={columns}
                        hide-checkbox-column
                        sorted-by="exposureAmount"
                        sorted-direction="desc">
                    </lightning-datatable>
                </div>
            </template>
            <template if:false={hasClients}>
                <p class="slds-p-around_medium slds-text-color_weak">
                    No impacted clients assigned to you for the latest market event.
                </p>
            </template>
        </lightning-card>

    </div>
</template>
